# hyprpaper -- desktop wallpaper daemon
# Launched from extra/autostart.lua. Without this file hyprpaper starts and
# paints nothing, which is exactly what it had been doing.
#
# SYNTAX: hyprpaper 0.8 replaced the old flat "preload = ..." plus
# "wallpaper = MONITOR,path" pair with these `wallpaper { }` blocks, and dropped
# `preload` entirely. The old syntax does not error -- it is silently ignored,
# and every monitor logs "has no target: no wp will be created". If wallpapers
# ever vanish after an upgrade, check that first.
#
# Images live in ~/Pictures/Wallpapers and are deliberately NOT tracked by
# chezmoi -- they are multi-MB binaries and would bloat the dotfiles repo.
# On a fresh machine, re-fetch them before this config does anything useful.
#
# To swap: edit the path, then `chezmoi apply ~/.config/hypr/hyprpaper.conf`
# and `pkill hyprpaper && hyprpaper & disown`.
#
# pink-clouds-{soft,vivid,max}.png are locally recoloured from pink-clouds.jpg
# via ~/.config/hypr/scripts/pinkify.py: the blue sky band (hue 185-290) is rotated toward magenta
# and saturation is scaled. The original was only ~54% pink because most of the
# frame was blue sky, not because the clouds were pale. Regenerate with
#   python3 ~/.config/hypr/scripts/pinkify.py <src> <dst> <sat_multiplier> <hue_rotation_degrees>
# soft=1.5/75, vivid=1.9/90, max=2.3/100. Above ~2.3 the sky gradient bands.

splash = false

# HDMI-A-2 -- 1920x1080 (16:9), primary. Locally recoloured from pink-clouds.jpg
# (see comment below); the original is kept alongside it.
wallpaper {
    monitor = HDMI-A-2
    path = ~/Pictures/Wallpapers/pink-clouds-soft.png
    fit_mode = cover
}

# HDMI-A-1 -- 1680x1050 (16:10). Same image as the primary. Source is 16:9, so
# `cover` crops the sides here, but the clouds are an all-over texture with no
# edge-anchored subject, so the crop is invisible.
wallpaper {
    monitor = HDMI-A-1
    path = ~/Pictures/Wallpapers/pink-clouds-soft.png
    fit_mode = cover
}
